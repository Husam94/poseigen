[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poseigen"
version = "0.1.0"
description = "Meta package for the Poseigen ML suite"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Husam Abdulnabi", email = "husam.abdulnabi@gmail.com" }]
maintainers = [{ name = "Husam Abdulnabi", email = "husam.abdulnabi@gmail.com" }]
keywords = ["poseigen", "bioinformatics", "machine-learning", "deep-learning"]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "poseigen_seaside",
  "poseigen_chisel",
  "poseigen_compass",
  "poseigen_binmeths",
  "poseigen_trident",
  "poseigen_mimic",
  "poseigen_oyster",
]

[project.urls]
Homepage = "https://github.com/husam94/poseigen"
Repository = "https://github.com/husam94/poseigen"
Issues = "https://github.com/husam94/poseigen/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]